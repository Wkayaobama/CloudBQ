name: 'Update README index'
# generated by .claude/skills/regen-workflow (new_regen_workflow.py --mode local); the steps live in the reusable workflow it calls
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regenerate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    uses: ./.github/workflows/regenerate.yml
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Regenerated-by:') }}   # a PAT push of the bot commit must not re-run this
    permissions:
      contents: write
    secrets: inherit
    with:
      run: |
        python3 .claude/skills/regen-workflow/assets/update_readme_index.py --readme README.md --dir docs --dir notebooks --exclude 'docs/diffs/*'
      paths: 'README.md'
      message: 'chore: update readme index'
      mode: 'commit'
      python-version: '3.12'
      working-directory: '.'
      fetch-depth: 1
