equality_checks:
- stage: after dry runs (same window, nothing written)
  compare: payload row_count, duplicate_suspects, day1_hot[] and window per entity — A vs B2 on the same watermark row
  A: 'deploy.sh dry (prints rows/dup/hot/window per entity); or curl -H "Authorization: Bearer $(gcloud auth print-identity-token)" "$URL?entity=SEALSQ&dry_run=1"
    | python3 -c ''import json,sys;p=json.load(sys.stdin);print(p["window"],p["row_count"],p["duplicate_suspects"],sorted(p["day1_hot"]))'''
  BC: 'B2: curl -X POST -H "X-Delivery-Token: …" "$N8N_URL/webhook/new-deals-run?entity=SEALSQ&dry_run=1" | same python one-liner. C: DRYRUN=1
    sql/scheduled_query.sh (syntax + bytes only) and, in hubspot_dev, SELECT COUNT(*), COUNTIF(duplicate_suspect), ARRAY_AGG(IF(day1_hot_flag,
    deal_id, NULL) IGNORE NULLS) FROM new_deals WHERE last_seen_run = <run_ts>'
  expected: 'A and B2: identical window (same watermark_in, query_end within seconds), identical row_count, duplicate_suspects and day1_hot set;
    rows_written 0 and report_state unchanged on both. C: same deal_ids in its 14-day window minus deals created after the last transfer.'
- stage: after first live run
  compare: rows per entity in hubspot.new_deals; the watermark rows; the new_deals_runs rows
  A: deploy.sh probe && deploy.sh status
  BC: bq query --use_legacy_sql=false 'SELECT entity, COUNT(*) FROM `$PROJECT.hubspot.new_deals` GROUP BY entity'; 'SELECT report_id, watermark,
    lock_until FROM `$PROJECT.hubspot.report_state` ORDER BY report_id'; 'SELECT run_ts, entity, orchestrator, row_count, rows_written, status
    FROM `$PROJECT.hubspot.new_deals_runs` ORDER BY run_ts DESC'
  expected: Per-entity counts identical whichever orchestrator ran; watermark NEW_DEALS_<entity> (A/B2) and NEW_DEALS_<entity>_C (C) == run_timestamp
    of that run; lock_until NULL; exactly one new_deals_runs row per run with rows_written == row_count and status OK (or OK_DELIVERY_FAILED with
    an error).
- stage: after a second identical run (same window, any surface)
  compare: counts unchanged; last_seen_run advanced; day1_* unchanged
  A: deploy.sh run SEALSQ again (or deploy.sh replay SEALSQ <previous watermark>) then deploy.sh probe
  BC: 'B2: POST the webhook again; C: bq mk --transfer_run --run_time=… again. Then: SELECT COUNT(*), COUNT(DISTINCT deal_id), MAX(last_seen_run),
    ANY_VALUE(day1_hot_score) FROM `$PROJECT.hubspot.new_deals` WHERE entity = ''SEALSQ'''
  expected: COUNT(*) == COUNT(DISTINCT deal_id) unchanged from the first run; last_seen_run == the second run_ts; day1_hot_score and first_seen_run
    unchanged; a second new_deals_runs row with rows_written == row_count (the MERGE updated, inserted nothing).
- stage: any time
  compare: hot score v1 for one deal_id across Python / JS / SQL — tests/hot_score_vectors.*
  A: python3 tests/test_hot_score.py (rebuilds tests/hot_score_vectors.json from main.py and runs node scoring/hot_score_v1.mjs on them); day1_hot_score
    of the deal in the payload / table
  BC: 'B2: tests/test_n8n_code.py (Code node rows == main.shape()); C: bq query --use_legacy_sql=false < tests/hot_score_vectors.sql (after sql/apply.sh)
    and SELECT hot_score_v1 FROM `$PROJECT.hubspot.hot_deals_v1` WHERE deal_id = ''<id>'''
  expected: 'Raw score |Δ| < 1e-9 Python vs JS, rounded score within 0.1, flags equal on all 15 vectors; every row of hot_score_vectors.sql ok
    = TRUE; the deal''s day1_hot_score in new_deals equals the vector for the same inputs (golden: Lattice Keystone C0 ASIC ≈ 81–90 by inputs).'
- stage: after write-back
  compare: writeback_log vs hot_deals_v1_writeback (the delta view must be empty)
  A: 'n/a — A does not write back; read the same view: bq query ''SELECT COUNT(*) FROM `$PROJECT.hubspot.hot_deals_v1_writeback`'''
  BC: 'C: writeback/deploy_job.sh execute then bq query ''SELECT status, COUNT(*) FROM `$PROJECT.hubspot.writeback_log` WHERE run_ts = (SELECT
    MAX(run_ts) FROM `$PROJECT.hubspot.writeback_log`) GROUP BY status''; bq query ''SELECT COUNT(*) FROM `$PROJECT.hubspot.hot_deals_v1_writeback'''
  expected: 'Dry: every row status DRY, no HubSpot call, view count unchanged. Live: status OK for every candidate, 0 ERROR, and the delta view
    returns 0 rows until a score changes; a second execution logs nothing new (value-idempotent).'
- stage: after first live run
  compare: duplicate flags A vs C (for twins present in new_deals)
