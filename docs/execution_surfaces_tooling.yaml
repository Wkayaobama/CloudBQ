title: Universal workflow — the tooling's three execution surfaces (developer shell · CI check · bot commit)
verdict: |
  Verdict (2026-10-16, branch claude/cloud-run-bigquery-pipeline-e94ziy at d18a95f, 42 commits since 2026-10-05): the four reusable
  skills (five tools, counting the diff ledger inside aider-scaffold) — aider-scaffold, tree-f-visualizer, pass-sequence, regen-workflow — ran on every building block of
  CloudBQ and were installed unchanged in IC-DBT-BQ. They execute on three surfaces. D, the developer's shell on a clone, is the only
  surface that creates: it writes the recipe, applies the block (aider when an LLM key is present, by hand otherwise — in this project
  aider never answered, 17 commits carry "Scaffolded-by: hand (no LLM key)"), verifies, commits with trailers, appends the ledger,
  regenerates the tree, rebuilds the workbook, refreshes the README index. C, the CI job "verify" on every push and pull request,
  re-runs the same generators in check mode and fails when a committed artefact is stale (27 ledger rows for 42 commits, the 15 others
  being ledger-only commits the ledger skips by design). B, the bot, is the one surface that commits without a person: a regen workflow
  runs one generator and commits what changed as github-actions[bot] with a "Regenerated-by:" trailer that the ledger skips. The README
  index is the one layer that is Parallel across all three (same script, same arguments, same output); everything else is Conditional
  on "same commit" or Divergent because only the developer surface creates and only the bot surface commits unattended. Remediation
  rows U01–U10 record what this project corrected on the way: the hand path when no key exists, a tree check that failed only in CI,
  a ledger check that needed full history, a workbook that is never byte-reproducible, a YAML pushed unparsed, and four review findings
  on the GitHub Actions skill fixed before the push.
legend: |
  Legend: Parity column colours — green Parallel, yellow Conditional, orange Divergent. Layers U0–U11 are the stages of the universal
  loop (install → recipe → apply → verify → commit → ledger → tree → workbook → index → generate workflows → review → push); Pipeline
  steps are the same loop as the operator runs it, in order, with the one LIVE gate (the push); Remediation rows U01–U10 are what
  CloudBQ corrected between 2026-10-05 and 2026-10-16, each with the commit or test that holds the fix. Source: the repository on
  branch claude/cloud-run-bigquery-pipeline-e94ziy at d18a95f; the same files live in IC-DBT-BQ at 250dc6d.
surfaces:
  D: D · Developer shell on a clone (python3, git, bash; aider when an LLM key is present)
  C: C · CI — .github/workflows/ci.yml job "verify" on push and pull_request (check mode, never writes)
  B: B · Bot — a regen workflow (.github/workflows/regenerate.yml callers) running one generator and committing as github-actions[bot]
motions:
  - motion: D · Developer shell on a clone
    acquire: git clone; the skills are files under .claude/skills/ in the clone (copied once into a new repository)
    ubuntu: 'python3 (standard library; PyYAML, openpyxl, pytest, nbformat for the generators and tests), git, bash; aider 0.86 with an LLM key, otherwise the hand path'
    driver: the person runs each command in order (the loop in UNIVERSAL_WORKFLOW.md); nothing is scheduled
    state: the working tree and the local commits until the push; .aider* history files (gitignored)
    assessment: 'The only surface that creates (recipe, block, annotations, spec); everything downstream checks or re-derives what it wrote. Its weak spot is forgetting a regeneration step — which is exactly what C catches.'
  - motion: C · CI check (ci.yml "verify")
    acquire: actions/checkout with fetch-depth 0 (the ledger check walks the whole history)
    ubuntu: 'ubuntu-latest, Python 3.12 (setup-python), Node 22 (setup-node), pip install of the function requirements + pyyaml openpyxl pytest nbformat'
    driver: on push and pull_request, every commit
    state: none — the job writes to /tmp only and never commits
    assessment: 'Cheap and exhaustive: the same generators in --check / --verify mode, the test suite, bash -n and node --check. It cannot fix anything; it tells the developer which regeneration they skipped. The workbook is verified from its YAML, not compared byte-wise (openpyxl output carries a timestamp).'
  - motion: B · Bot commit (regen workflow)
    acquire: actions/checkout (fetch-depth as the caller asks; persist-credentials so the step can push)
    ubuntu: 'ubuntu-latest, Python/Node as the caller asks; the generator named in the caller''s run: input; assets/commit_if_changed.sh embedded verbatim'
    driver: 'push to main and workflow_dispatch (update-readme-index.yml); any trigger the generator writes — schedule, pull_request (check mode forced)'
    state: a commit on the branch as github-actions[bot] with a Regenerated-by trailer, or "No changes to commit"
    assessment: 'The one surface that commits unattended, so it is the most constrained: one generator, one commit step, a change check, a trailer the ledger skips, a guard against re-running on its own commit, a push that retries only on a race. Today it owns the README index; the tree and the workbook are its prospective next consumers.'
layers:
  - id: U0
    layer: Install the skills (code acquisition)
    D: 'copy .claude/skills/{aider-scaffold,tree-f-visualizer,pass-sequence,regen-workflow}/ into the repository; .aider.conf.yml, .aiderignore, CONVENTIONS.md at the root; .claude/agents/ optional'
    C: the checkout of the pushed commit carries the same files
    B: the checkout of the pushed commit carries the same files
    parity: Conditional
    diverges: The developer may be ahead of the pushed commit; C and B always run what was pushed.
    remediation: 'Push before relying on CI; the fresh-clone replay (step 10) runs the suite on exactly what will be pushed.'
    verified: 'IC-DBT-BQ (250dc6d) carries the four skills'' pages, scripts, references and config assets byte-identical to CloudBQ d18a95f; only aider-scaffold/assets/recipes/ differs, by design (ports be0b280, a96fae0, 041a528, 541127d)'
  - id: U1
    layer: Conventions and recipe
    D: 'CONVENTIONS.md (rules every block follows); one recipe per block in .claude/skills/aider-scaffold/assets/recipes/<block>.md: purpose, files, contract, what not to do'
    C: n/a — prose, not executed
    B: n/a
    parity: Divergent
    diverges: Only the developer surface reads the recipe.
    remediation: 'The recipe path travels: "Recipe:" trailer in the commit, recipe: key of the block''s node in docs/architecture.yaml, recipe column of the ledger — so a reader on any surface finds it.'
    verified: 'at d18a95f: 12 recipes on disk; 17 commits carry Scaffolded-by, 13 of them also a Recipe trailer; 85 of the 92 annotated nodes name a recipe (this page adds one recipe and three nodes)'
  - id: U2
    layer: Apply the block
    D: 'aider_scaffold.py <recipe> <files>: with an LLM key aider edits and auto-commits each step (author "<you> (aider)", Recipe trailer); without one the wrapper prints the recipe and exits 2 and the block is applied by hand'
    C: n/a
    B: n/a — the bot regenerates derived files; it never applies a block
    parity: Divergent
    diverges: Two paths on one surface (aider or hand); none on the others.
    remediation: 'Both paths end in the same commit shape: Recipe trailer plus either aider''s attribution or "Scaffolded-by: hand (no LLM key)"; the ledger row is the same either way.'
    verified: 'this project: no LLM key in the environment, aider never answered; 17 hand commits; ledger column "aider" reads "no" on all 27 rows'
  - id: U3
    layer: Verify (gate before the commit)
    D: 'python3 -m pytest tests -q; bash -n on every script; node --check; build_workflow.py --check; tree_f.py --check; diff_ledger.py --check; build_surfaces_xlsx.py --verify; update_readme_index.py --check'
    C: the same commands in ci.yml, job verify
    B: 'only the generator and the commit step run; the bot''s commit is tested by C only when it was pushed with a PAT (REGEN_TOKEN) — GITHUB_TOKEN pushes start no workflow'
    parity: Conditional
    diverges: Same checks on D and C from the same commit; the bot's own commit is unverified unless a PAT is used.
    remediation: 'Keep the bot to generators whose output is already covered (the README index is derived from committed files); store a PAT as REGEN_TOKEN when the regenerated commit must run CI.'
    verified: 'the run: steps of ci.yml (job verify); README "Verify before you push" block; 40 tests pass, 1 skipped at d18a95f'
  - id: U4
    layer: Commit with trailers
    D: 'git commit with "Recipe: <path>" and "Scaffolded-by: hand (no LLM key)" (hand path) or aider''s own commit; the ledger commit "docs: diff ledger update" has no trailer'
    C: never commits
    B: 'commit_if_changed.sh commits as github-actions[bot] with "Regenerated-by: <workflow> (<run url>)"'
    parity: Divergent
    diverges: Three authorships (person, aider, bot).
    remediation: 'The trailer vocabulary tells them apart and drives the ledger: Recipe → recipe column; aider attribution → aider column; Regenerated-by → skipped; ledger-only commits → skipped.'
    verified: 'git log trailers at d18a95f: 17 Scaffolded-by, 13 Recipe (the four earliest tooling commits carry Scaffolded-by alone); tests/test_regen_workflow.py::test_commit_step_actions_shape asserts the Regenerated-by URL'
  - id: U5
    layer: Diff ledger
    D: 'diff_ledger.py appends docs/diffs/NNNN-<sha>-<slug>.patch and a row to INDEX.md for every commit not yet listed; committed as "docs: diff ledger update"'
    C: 'diff_ledger.py --check (fetch-depth 0): exit 1 names every commit missing from INDEX.md'
    B: 'not run; the bot''s commits are skipped by the ledger (Regenerated-by trailer), so --check stays green after a regeneration'
    parity: Conditional
    diverges: C only checks; the ledger is current only when D ran it before pushing.
    remediation: 'Run the ledger as the last local step (after the block commit) and commit it; CI refuses a push that skipped it.'
    verified: '27 rows for 42 commits (15 ledger-only commits skipped); test_ledger_skips_regenerated_commits; ci.yml fetch-depth 0 since 8d14e0d'
  - id: U6
    layer: Architecture tree (annotations → tree /f)
    D: 'annotate the block in docs/architecture.yaml (scenarios, layer, role, status, parity, recipe), then tree_f.py writes ARCHITECTURE_TREE.txt, architecture.manifest.json, architecture_tree.html'
    C: tree_f.py --check — fails when the committed outputs differ from a fresh render
    B: 'prospective: a regen workflow could render the tree on push (one new_regen_workflow.py command); not configured today'
    parity: Conditional
    diverges: Same render from the same tree; the output depends only on the clone's files and the annotations.
    remediation: 'The walker drops empty directories and labels the root from the annotations'' project: key, so a clone reproduces the developer''s render byte for byte (8d14e0d).'
    verified: 'the tree check has not failed in CI since 8d14e0d (it failed at 9d0a184 and a7e64de before; later red runs stopped earlier, at pytest: 0a54e5f, 298c7db); 92 nodes at d18a95f; exclude: [''*.patch''] keeps the ledger out of the tree'
  - id: U7
    layer: Surfaces workbook (pass-sequence)
    D: 'edit docs/execution_surfaces*.yaml, then build_surfaces_xlsx.py --spec … --out docs/EXECUTION_SURFACES*.xlsx --verify; commit YAML and workbook together'
    C: 'build_surfaces_xlsx.py --spec … --out /tmp/surfaces.xlsx --verify (builds and checks the formulas'' values; never compares the committed binary)'
    B: 'not a bot job: the builder''s output is never byte-identical, so a scheduled rebuild would commit a changed file every run; the developer rebuilds when the YAML changes'
    parity: Conditional
    diverges: The YAML is the source of truth; the workbook is derived and not byte-reproducible (openpyxl writes a timestamp).
    remediation: 'Rebuild only when the YAML changed; otherwise git checkout the committed workbook before committing (a --verify run rewrites it). CI verifies the spec, not the bytes.'
    verified: 'verify: OK on execution_surfaces.yaml (Layers 4/4/10, steps 2/5/6), execution_surfaces_l2.yaml (Layers 0/6/9, steps 2/6/4) and this spec (Layers 1/6/5, steps 1/5/5); the 1-byte xlsx churn observed on 2026-10-16 and reverted'
  - id: U8
    layer: README index (the first regenerated artefact)
    D: 'update_readme_index.py --readme README.md --dir docs --dir notebooks --exclude ''docs/diffs/*'' (writes the block between the regen:docs-index markers)'
    C: the same command with --check
    B: 'update-readme-index.yml on push to main and workflow_dispatch: the same command, then commit_if_changed.sh'
    parity: Parallel
    diverges: ''
    remediation: ''
    verified: 'README.md: unchanged on D and C after every commit of 2026-10-16; the caller''s run: line is the README command verbatim'
  - id: U9
    layer: Workflow generation (regen-workflow)
    D: 'new_regen_workflow.py --name … --run … --paths … [--on …] [--mode inline|local|Owner/Repo@ref]; --emit-reusable once per repository'
    C: 'tests/test_regen_workflow.py (15 tests) run by pytest: shapes, the commit step in a temporary repository, index, ledger skip'
    B: executes what D generated
    parity: Conditional
    diverges: CI tests the generator, not that the committed workflow files equal its current output.
    remediation: 'After changing the generator, regenerate with --force and compare: diff <(new_regen_workflow.py --emit-reusable --print) .github/workflows/regenerate.yml (empty); actionlint when available.'
    verified: 'both committed workflows equal to --print output at d18a95f; actionlint 1.7.12 clean on all three workflow files on 2026-10-16 (a local run, not reproducible from the clone)'
  - id: U10
    layer: Review before the push
    D: 'adversarial review of the block (independent critics per dimension, skeptics that try to refute each finding, fixes, tests added for every confirmed finding)'
    C: n/a — judgement, not a check
    B: n/a
    parity: Divergent
    diverges: Only a person or an agent reviews.
    remediation: 'Every confirmed finding becomes a test or a --check so C holds it afterwards (regen-workflow: 13 → 15 tests between 41a9634 and 610d41e).'
    verified: 'review rounds on deploy.sh (574e954), the notebooks (e88c27a) and the GitHub Actions skill (41a9634 → 610d41e: tests 13 → 15, each new test holding one finding); the review records themselves are not kept in the repository'
  - id: U11
    layer: Push, PR, CI
    D: 'fresh-clone replay of the whole verify block, then git push -u origin <branch>; the PR is opened from the UI'
    C: 'on: [push, pull_request] → verify; the PR head shows the check'
    B: 'git push origin HEAD:refs/heads/<branch> with a rebase-and-retry on a race; a non-race refusal (protected branch, hook) stops at once'
    parity: Divergent
    diverges: A person pushes a reviewed series; the bot pushes one derived commit.
    remediation: 'Branch protection: add the Actions app or the PAT user to the bypass list, or let the bot regenerate on a branch and run pull_request in check mode.'
    verified: 'PR Wkayaobama/CloudBQ#1: heads c978940, 5c777c9, d18a95f green (check on github.com; not derivable from the clone); test_commit_step_retries_a_race_and_stops_on_a_refusal'
steps:
  - n: 1
    step: recipe
    gate: ''
    D: 'write .claude/skills/aider-scaffold/assets/recipes/<block>.md (purpose, /add files, contract, what not to do); add the block to docs/architecture.yaml with status: proposed'
    C: n/a
    B: n/a
    parity: Divergent
    artefact: the recipe file; the proposed node drawn dashed in architecture_tree.html
    notes: Self-contained — aider sees only the recipe, the added files and CONVENTIONS.md.
  - n: 2
    step: apply
    gate: ''
    D: 'python3 .claude/skills/aider-scaffold/scripts/aider_scaffold.py <recipe> <files> (refuses a dirty tree); exit 2 without an LLM key → apply by hand'
    C: n/a
    B: n/a
    parity: Divergent
    artefact: the working-tree diff (aider auto-commits; the hand path commits in step 4)
    notes: One block, one commit; no refactoring of neighbours.
  - n: 3
    step: verify
    gate: ''
    D: 'python3 -m pytest tests -q; bash -n <scripts>; node --check <mjs>; the generators'' --check'
    C: ci.yml verify (same commands)
    B: n/a
    parity: Conditional
    artefact: '"N passed" and every --check "up to date" / "unchanged"'
    notes: What fails here fails in CI; fix before committing.
  - n: 4
    step: commit
    gate: ''
    D: 'git commit -m "<block>" -m "Recipe: <path>" -m "Scaffolded-by: hand (no LLM key)" (hand path); aider already committed otherwise'
    C: n/a
    B: 'commit_if_changed.sh (inside the regen workflow) — commit as github-actions[bot] with the Regenerated-by trailer'
    parity: Divergent
    artefact: one commit per block / per regeneration
    notes: Project policy may add Co-Authored-By and session trailers; the ledger ignores them.
  - n: 5
    step: ledger
    gate: ''
    D: 'python3 .claude/skills/aider-scaffold/scripts/diff_ledger.py; git add docs/diffs; git commit -m "docs: diff ledger update"'
    C: diff_ledger.py --check
    B: n/a (skipped by design)
    parity: Conditional
    artefact: 'docs/diffs/NNNN-<sha>-<slug>.patch + one INDEX.md row (n · sha · date · author · aider · recipe · files · +/− · patch)'
    notes: Runs after the last commit of the block (including the docs commit of steps 6–8); re-running adds only unlisted commits.
  - n: 6
    step: tree
    gate: ''
    D: 'edit docs/architecture.yaml (status proposed → new); python3 .claude/skills/tree-f-visualizer/scripts/tree_f.py --root . --annotations docs/architecture.yaml --out-json docs/architecture.manifest.json --out-ascii docs/ARCHITECTURE_TREE.txt --out-html docs/architecture_tree.html'
    C: the same command with --check
    B: prospective regen consumer
    parity: Conditional
    artefact: 'three files; "tree_f --check: up to date" afterwards'
    notes: Status and parity words are validated; a typo stops the build.
  - n: 7
    step: workbook
    gate: ''
    D: 'edit docs/execution_surfaces*.yaml; python3 .claude/skills/pass-sequence/scripts/build_surfaces_xlsx.py --spec <yaml> --out <xlsx> --verify'
    C: the same with --out /tmp/surfaces.xlsx --verify
    B: 'n/a — not a bot job (the output is never byte-identical)'
    parity: Conditional
    artefact: 'the workbook and the printed parity counts ("verify: OK")'
    notes: Only when a layer, step, remediation or equality row changed; otherwise restore the committed xlsx.
  - n: 8
    step: index
    gate: ''
    D: 'python3 .claude/skills/regen-workflow/assets/update_readme_index.py --readme README.md --dir docs --dir notebooks --exclude ''docs/diffs/*'''
    C: the same with --check
    B: update-readme-index.yml runs the same command and commits
    parity: Parallel
    artefact: the Documents block of README.md between the regen:docs-index markers
    notes: The one step all three surfaces run identically.
  - n: 9
    step: review
    gate: ''
    D: adversarial review of the block; fixes; a test per confirmed finding; back to step 3
    C: n/a
    B: n/a
    parity: Divergent
    artefact: findings with file:line, verdicts, the tests that hold them
    notes: Run the skeptics on the tree as it is when they run — a finding against an already-fixed draft reads "refuted".
  - n: 10
    step: replay
    gate: ''
    D: 'git clone <repo> /tmp/replay && cd /tmp/replay && <the whole "Verify before you push" block>'
    C: the CI run is the same replay on the pushed commit
    B: n/a
    parity: Conditional
    artefact: REPLAY-OK locally, a green check on the PR head
    notes: Catches files that exist only in the working tree (untracked, gitignored, generated).
  - n: 11
    step: push
    gate: LIVE PUSH
    D: 'git push -u origin <branch>; open or update the PR'
    C: verify runs on the new head
    B: 'git push origin HEAD:refs/heads/<branch> (retry on a race only)'
    parity: Divergent
    artefact: the PR head's check is green
    notes: Never push to another branch without permission; the bot pushes to the branch it ran on.
remediation:
  - id: U01
    symptom: 'aider_scaffold.py prints the recipe and exits 2: "no LLM key"'
    layer: U2
    surfaces: D
    cause: 'No ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY / DEEPSEEK_API_KEY in the environment; aider cannot answer'
    fix: 'Apply the recipe by hand; commit with "Recipe: <path>" and "Scaffolded-by: hand (no LLM key)"; run the ledger — the row is identical to aider''s'
    verified: 17 commits with the trailer; ledger aider column "no" on all 27 rows (2026-10-05 → 2026-10-16)
  - id: U02
    symptom: 'tree_f.py --check green locally, red in CI'
    layer: U6
    surfaces: C
    cause: 'An empty directory (workflows/templates) existed in the clone but not in git; the root label came from the folder name, which differs on the runner'
    fix: 'The walker drops empty directories; the root is labelled from the annotations'' project: key'
    verified: 8d14e0d (2026-10-14); the tree check has not failed in CI since
  - id: U03
    symptom: 'diff_ledger.py --check in CI reports commits missing that INDEX.md lists'
    layer: U5
    surfaces: C
    cause: shallow checkout (fetch-depth 1) — the ledger walks the whole branch history
    fix: 'actions/checkout with fetch-depth: 0 in ci.yml'
    verified: 8d14e0d; ci.yml line 8
  - id: U04
    symptom: 'git status shows docs/EXECUTION_SURFACES*.xlsx modified (1 byte) after a --verify run although the YAML did not change'
    layer: U7
    surfaces: D
    cause: openpyxl writes a timestamp into the package; the workbook is never byte-reproducible
    fix: 'CI builds to /tmp; locally, git checkout the committed xlsx before committing unless the YAML changed'
    verified: 2026-10-16 (restored before commits 41a9634 and 610d41e)
  - id: U05
    symptom: 'a pushed docs/execution_surfaces.yaml did not parse (plain scalars containing ": "); the chained command had not stopped'
    layer: U7
    surfaces: D C
    cause: 'a plain scalar containing ": " was not quoted; the spec was committed without a --verify build'
    fix: 'quote plain scalars containing ": "; build with --verify before committing (the builder''s yaml.safe_load is the parse check); CI''s workbook step catches an unparsable spec; the regen generator parses its own output before writing'
    verified: 40e9544 (the quoted scalar, 2026-10-16); CI red at 0a54e5f, green from fdb5e39
  - id: U06
    symptom: 'a regen workflow on pull_request would have failed at checkout for a fork PR (found in the pre-push review of a draft)'
    layer: U9
    surfaces: B
    cause: 'ref: ${{ github.head_ref || github.ref }} names a branch that exists only in the fork'
    fix: 'no ref: on the checkout — the event''s default ref (merge ref on pull_request); 41a9634 never emitted ref:'
    verified: 'references/github-actions-facts.md; test_inline_workflow_shape asserts no ref:'
  - id: U07
    symptom: 'a file the generator deleted stayed tracked after the bot''s commit when --paths held a glob'
    layer: U9
    surfaces: B
    cause: the shell expanded the glob to the surviving files before git saw it
    fix: set -f around the staging loop so git receives the pathspec
    verified: test_commit_step_globs_stage_deletions
  - id: U08
    symptom: 'a caller of a shared regenerate.yml in another repository handed over every secret'
    layer: U9
    surfaces: B
    cause: 'secrets: inherit emitted for every caller'
    fix: 'both caller modes pass exactly REGEN_TOKEN'
    verified: 610d41e; test_local_and_remote_callers
  - id: U09
    symptom: 'new_regen_workflow.py failed at import in a repository without PyYAML'
    layer: U9
    surfaces: D
    cause: a non-stdlib import used only for a self-check, unstated in the skill page
    fix: 'optional import — the parse check is skipped with a note; SKILL.md states the prerequisites and how to install the skill elsewhere'
    verified: 610d41e; test_generator_without_pyyaml_and_bad_inputs
  - id: U10
    symptom: 'the bot''s first run on main ("Update README index", run 38958479320) was cancelled after 1 s: "Canceling since a deadlock was detected for concurrency group ''regenerate-Update README index-refs/heads/main'' between a top level workflow and ''regenerate''"'
    layer: U9
    surfaces: B
    cause: 'the thin caller and the reusable workflow both declared a top-level concurrency group with the same value; GitHub treats the called workflow''s group as the job''s and refuses the self-deadlock'
    fix: 'regenerate.yml declares no concurrency group; the inline workflow and the thin caller own it (new_regen_workflow.py; test_reusable_workflow_shape asserts the absence)'
    verified: 'this commit; the first bot run after it merges to main is the proof — no local tool evaluates GitHub''s concurrency rules'
equality_checks:
  - stage: after every block commit
    compare: ledger rows vs commits (ledger-only and Regenerated-by commits excluded)
    D: python3 .claude/skills/aider-scaffold/scripts/diff_ledger.py --check
    CB: 'ci.yml: python .claude/skills/aider-scaffold/scripts/diff_ledger.py --check (fetch-depth 0)'
    expected: '"0 commit(s) not in docs/diffs/INDEX.md" on both'
  - stage: after annotating a block
    compare: the three tree outputs vs a fresh render
    D: tree_f.py … --check
    CB: 'ci.yml: the same --check'
    expected: '"tree_f --check: up to date" on both; a fresh clone renders byte-identical files'
  - stage: after editing a surfaces YAML
    compare: the Overview formulas' values vs the counts the builder prints
    D: build_surfaces_xlsx.py --spec <yaml> --out <xlsx> --verify
    CB: 'ci.yml: --out /tmp/surfaces.xlsx --verify'
    expected: '"verify: OK"; Parallel + Conditional + Divergent == rows'
  - stage: after adding or renaming a document
    compare: the README Documents block vs the files under docs/ and notebooks/
    D: update_readme_index.py … (write) then … --check
    CB: 'ci.yml --check; the bot prints "No changes to commit" when the developer already refreshed it'
    expected: '"README.md: unchanged" on all three'
  - stage: after changing the generator
    compare: committed workflow files vs the generator's current output
    D: 'diff <(python3 .claude/skills/regen-workflow/scripts/new_regen_workflow.py --emit-reusable --print) .github/workflows/regenerate.yml'
    CB: 'python -m pytest tests/test_regen_workflow.py -q (15 tests)'
    expected: empty diff; 15 passed
  - stage: before the push
    compare: the fresh-clone replay vs the CI run
    D: 'git clone … /tmp/replay; the whole "Verify before you push" block → REPLAY-OK'
    CB: the verify job on the pushed head
    expected: identical outcome — what passed in the replay passes in CI
parity_meanings:
  Parallel: same script, same arguments, same output on every surface (the README index)
  Conditional: same result when the stated condition holds (same commit; the developer ran the regeneration before pushing; a PAT for the bot's commit to run CI)
  Divergent: a stage only one surface performs (creating, reviewing, committing unattended); the trailer vocabulary and the checks make the surfaces agree afterwards
