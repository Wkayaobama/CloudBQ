steps:
- n: 1
  step: check-env
  gate: ''
  A: deploy.sh check-env — refuses an unset or placeholder PROJECT REGION DATASET FN SA_NAME BQ_LOCATION; requires gcloud and bq
  B: same .env; deploy/n8n/deploy_n8n.sh refuses an unset PROJECT and N8N_IMAGE=:latest; scheduler.sh / secrets.sh / cloudsql.sh require PROJECT
  C: same .env; sql/apply.sh refuses placeholders in PROJECT SYNC_DATASET SYNC_DEALS_TABLE SYNC_OWNERS_TABLE; writeback/deploy_job.sh requires
    HUBSPOT_WRITE_TOKEN_VERSION
  parity: Conditional
  artefact: 'the echo line "project=… region=… dataset=… fn=… sa=… schedules: …" (A); rendered files without "${" (B, C)'
  notes: Same result when all three read the one .env copied from .env.example (they do). SYNC_* values exist only after C's first transfer run
    (R36).
- n: 2
  step: enable-apis
  gate: ''
  A: deploy.sh enable-apis — run, cloudbuild, artifactregistry, secretmanager, cloudscheduler, bigquery
  B: deploy/n8n/deploy_n8n.sh enables run, sqladmin, secretmanager, cloudscheduler inline; cloudsql.sh enables sqladmin
  C: n/a in scripts — bigquerydatatransfer.googleapis.com (scheduled queries, DTS) is not enabled by any script (R45)
  parity: Divergent
  artefact: gcloud services list --enabled shows the APIs
  notes: Idempotent on every surface. C relies on the BigQuery Data Transfer API being already on.
- n: 3
  step: iam
  gate: ''
  A: deploy.sh iam — SA new-deals-fn (describe || create), roles/bigquery.jobUser, roles/run.builder for <project-number>-compute@
  B: deploy/n8n/secrets.sh — SAs n8n-run (cloudsql.client, secretAccessor ×3) and n8n-bq (jobUser + DCL GRANT + JSON key → deploy/n8n/.secrets/)
  C: sql/scheduled_query.sh — SA new-deals-sql (jobUser + DCL GRANT); writeback/deploy_job.sh deploy — SAs new-deals-writeback (jobUser + GRANT
    + secretAccessor) and new-deals-scheduler
  parity: Divergent
  artefact: gcloud iam service-accounts list shows the SAs; gcloud projects get-iam-policy shows the bindings
  notes: Five identities in all; only B needs a key (B-G10). Each script is describe-then-create.
- n: 4
  step: tables
  gate: ''
  A: deploy.sh tables — renders bigquery_schema.sql (CREATE SCHEMA, report_state + lock_until, new_deals, new_deals_runs, new_deals_last_7d) then
    GRANT dataEditor
  B: n/a — B2 writes A's tables (its SQL is generated from bigquery_schema.sql); needs new_deals_history from sql/audit_tables.sql too (R44)
  C: sql/apply.sh — bigquery_schema.sql → audit_tables.sql (new_deals_history, writeback_log) → hot_score_v1.sql → deals_synced_v1.sql → hot_deals_v1.sql
  parity: Divergent
  artefact: bq ls $PROJECT:hubspot lists report_state, new_deals, new_deals_runs, new_deals_history, writeback_log, hot_score_v1, the views
  notes: All DDL is IF NOT EXISTS / OR REPLACE. Until R44 is folded in, run sql/apply.sh (or audit_tables.sql) before the first live run of A
    or B2.
- n: 5
  step: secret
  gate: ''
  A: 'IFS= read -rsp … HUBSPOT_TOKEN; HUBSPOT_TOKEN="$HUBSPOT_TOKEN" deploy.sh secret — hubspot-token create or versions add (a version per run), secretAccessor for the SA; prints the version NUMBER (value(name.basename()), R47) to pin in .env SECRET_VERSION (optional: deploy resolves the newest enabled number)'
  B: deploy/n8n/secrets.sh — n8n-encryption-key, n8n-db-password, n8n-webhook-token (generated, create-only); HubSpot token copied by hand into
    an n8n credential
  C: printf '%s' "$WRITE_TOKEN" | gcloud secrets create hubspot-token-write --data-file=- (manual; not scripted) then HUBSPOT_SCHEMA_TOKEN=… writeback/bootstrap_property.sh
    (one-off)
  parity: Divergent
  artefact: gcloud secrets versions list <name> shows an enabled version; HubSpot GET /crm/v3/properties/deals/hot_score_v1 → 200 (C)
  notes: Tokens never pass through .env or git. C needs a second private app with crm.objects.deals.write (R35).
- n: 6
  step: deploy
  gate: LIVE DEPLOY
  A: deploy.sh deploy — gcloud run deploy $FN --source . --function new_deals_report --base-image python312 --no-allow-unauthenticated --service-account
    $SA --timeout 540 --memory 512Mi --max-instances 1 --concurrency 1 --set-env-vars … --set-secrets HUBSPOT_TOKEN=hubspot-token:<ver>
  B: deploy/n8n/cloudsql.sh → deploy/n8n/deploy_n8n.sh (services replace, allUsers invoker) → create credentials in the UI, fill workflows/credentials.map.json
    → N8N_URL=… N8N_API_KEY=… deploy/n8n/import_workflows.sh
  C: sql/sync_transfer.sh (first transfer) → fill SYNC_* in .env → sql/apply.sh → HUBSPOT_TOKEN=… sql/refresh_pipeline_labels.sh → DISABLE_SCHEDULE=1
    sql/scheduled_query.sh → writeback/deploy_job.sh (WRITEBACK_APPROVE=0)
  parity: Divergent
  artefact: 'A: revision Ready, URL printed; B: n8n URL printed, 3 workflows listed in the editor; C: 2 transfer configs new-deals-<entity>-C
    (no auto scheduling), job new-deals-writeback'
  notes: 'A''s canonical form (R05). B: publish/activate only after a manual test execution. C: the DTS connector decides the synced table names
    (R36).'
- n: 7
  step: invoker
  gate: ''
  A: deploy.sh invoker — roles/run.invoker for the SA on the service; Scheduler jobs new-deals-SEALSQ / -ICALPS created PAUSED (OIDC, audience
    = URL, 600s, 3 retries)
  B: deploy/n8n/scheduler.sh create — jobs n8n-new-deals-SEALSQ / -ICALPS created PAUSED (POST webhook, X-Delivery-Token header, 900s, 3 retries)
  C: writeback/deploy_job.sh deploy also binds roles/run.invoker for new-deals-scheduler@ on the job and creates Scheduler job new-deals-writeback
    (30 5 * * 1 Zurich, OAuth) — enabled, but the job stays DRY
  parity: Divergent
  artefact: gcloud scheduler jobs list --location $REGION shows the jobs (A/B PAUSED, C ENABLED); gcloud run services get-iam-policy $FN shows
    run.invoker for the SA
  notes: 'R02: without run.invoker Scheduler gets 403. Three auth mechanisms (OIDC / shared header / OAuth to jobs.run).'
- n: 8
  step: dry
  gate: ''
  A: 'deploy.sh dry — curl -sSf $URL?entity=SEALSQ&dry_run=1 and ICALPS with the caller''s identity token (a service account''s carries audience = $URL, R48); asserts rows_written == 0 and dry_run true; an HTTP 403 (caller lacks run.invoker) or 409 (lease held) fails the step (R50); prints rows/dup/hot/window'
  B: 'curl -X POST -H "X-Delivery-Token: $(gcloud secrets versions access latest --secret n8n-webhook-token)" "$N8N_URL/webhook/new-deals-run?entity=SEALSQ&dry_run=1"
    (and ICALPS); or a manual execution in the editor'
  C: DRYRUN=1 sql/scheduled_query.sh (bq query --dry_run of both rendered scripts); writeback/deploy_job.sh execute with WRITEBACK_APPROVE=0 →
    writeback_log rows status DRY; optional full rehearsal in a hubspot_dev dataset
  parity: Conditional
  artefact: 'payload {report_id, run_timestamp, orchestrator, dry_run: true, window{watermark_in, query_start, query_end}, row_count, rows_written:
    0, duplicate_suspects, day1_hot[], rows[]} (A, B2); bytes processed + DRY rows (C)'
  notes: THE GATE before any LIVE row below. Same numbers for A and B2 on the same window (Equality checks). C's SQL half has no compute-only
    mode; its dry run is syntax + the dev dataset.
- n: 9
  step: run
  gate: LIVE NEW_DEALS_WRITE
  A: 'deploy.sh run SEALSQ then deploy.sh run ICALPS — one live window run each (the first without a watermark looks back FIRST_RUN_DAYS); prints report_id, run_timestamp, window, row_count, rows_written, duplicate_suspects, day1_hot; refuses an error payload or one without rows_written (R50); each run moves the watermark — the idempotency check is step 13 replay, not a second run (R52)'
  B: 'curl -X POST -H "X-Delivery-Token: …" "$N8N_URL/webhook/new-deals-run?entity=SEALSQ" (and ICALPS), or gcloud scheduler jobs run n8n-new-deals-SEALSQ'
  C: bq mk --transfer_run --run_time=$(date -u +%FT%TZ) <transfer config new-deals-SEALSQ-C> (and ICALPS); then writeback/deploy_job.sh execute
    (still DRY until step 10)
  parity: Conditional
  artefact: rows_written == row_count; hubspot.new_deals holds the rows; report_state NEW_DEALS_<entity> (A, B2) / NEW_DEALS_<entity>_C (C) watermark
    == run_timestamp; one new_deals_runs row per run
  notes: First run with no watermark looks back FIRST_RUN_DAYS=7 (A, B2) / 14 days lookback (C). Re-running the same window writes nothing new
    (MERGE). Requires new_deals_history (R44).
- n: 10
  step: enable
  gate: LIVE SCHEDULER_ENABLE
  A: 'deploy.sh enable — gcloud scheduler jobs resume new-deals-SEALSQ / -ICALPS, only those in state PAUSED (idempotent, R49); pause likewise only ENABLED jobs'
  B: deploy/n8n/scheduler.sh enable — resume n8n-new-deals-SEALSQ / -ICALPS; activate the workflows (UI or POST /api/v1/workflows/<id>/activate)
  C: sql/scheduled_query.sh without DISABLE_SCHEDULE (bq update --transfer_config re-enables auto scheduling); writeback/deploy_job.sh live (WRITEBACK_APPROVE=1
    on the job)
  parity: Conditional
  artefact: 'jobs ENABLED; gcloud scheduler jobs run new-deals-SEALSQ → HTTP 200 in the job log; C: transfer configs scheduled, job env WRITEBACK_APPROVE=1'
  notes: Only after step 8 passed on both entities and step 9 was probed. Same clock on A and B2 is the L3 condition; C's chain must keep its
    slack. Do not run A and B2 live on the same report_id at the same time (they share the watermark row).
- n: 11
  step: probe
  gate: ''
  A: deploy.sh probe — SELECT entity, COUNT(*) n, COUNTIF(day1_hot_flag) hot, COUNTIF(duplicate_suspect) dup, MIN(createdate), MAX(createdate)
    FROM new_deals GROUP BY entity; last 10 new_deals_runs
  B: same two bq queries (any shell with bq); n8n Executions list is additive
  C: same two bq queries; plus SELECT status, COUNT(*) FROM writeback_log WHERE DATE(run_ts) = CURRENT_DATE() GROUP BY status
  parity: Parallel
  artefact: the two result tables — identical from every scenario because every scenario writes the same dataset
  notes: Paste the dated output verbatim into the Overview verdict and docs/EXECUTION_SURFACES.md after the first live run.
- n: 12
  step: status
  gate: ''
  A: deploy.sh status — SELECT report_id, watermark, lock_until, updated_at FROM report_state ORDER BY report_id; gcloud scheduler jobs describe
    (state, schedule, lastAttemptTime)
  B: same bq query (rows NEW_DEALS_<entity>); gcloud scheduler jobs describe n8n-new-deals-<entity>
  C: same bq query (rows NEW_DEALS_<entity>_C); bq ls --transfer_run <config>; gcloud run jobs executions list --job new-deals-writeback
  parity: Parallel
  artefact: one report_state row per entity per orchestrator family (A/B2 share NEW_DEALS_<entity>; C has _C); watermark == last successful run_timestamp;
    lock_until NULL between runs
  notes: 'Where am I: the watermark is the checkpoint. The per-surface describe commands are additive.'
- n: 13
  step: replay
  gate: LIVE REPLAY
  A: 'deploy.sh replay SEALSQ FROM_ISO — UPDATE report_state SET watermark = TIMESTAMP ''FROM'' WHERE report_id = ''NEW_DEALS_SEALSQ'' then deploy.sh run SEALSQ; the runbook''s idempotency check with FROM = window.query_start of the first run (R52): probe counts unchanged'
  B: the same UPDATE with bq query, then POST the webhook for that entity (step 9, B column)
  C: 'bq mk --transfer_run --start_time=2026-09-28T04:00:00Z --end_time=2026-10-05T04:00:00Z <config>; HubSpot side: DELETE FROM writeback_log
    WHERE run_ts = … then gcloud run jobs execute new-deals-writeback'
  parity: Conditional
  artefact: row count unchanged for an already-loaded window; last_seen_run advanced; day1_hot_score unchanged; a new new_deals_history slice
    per run_ts
  notes: Backfill route (L12). Idempotent through the MERGE and the frozen set; C's lookback must cover the gap.
remediation:
- id: R01
  symptom: 'User risk table: bq query GRANT … TO ''serviceAccount:…'' "fails at the principal"; on a fresh project the GRANT fails with dataset
    not found'
  layer: L1
  surfaces: A B C
  cause: 'Single-quoted principals are legal GoogleSQL (lexical reference) — the real failure is ordering: the GRANT ran before anything created
    the dataset (G12 CONFIRMED, corrects the risk table).'
  fix: 'deploy.sh tables: CREATE SCHEMA IF NOT EXISTS first (bigquery_schema.sql line 1), then GRANT `roles/bigquery.dataEditor` ON SCHEMA `${PROJECT}.${DATASET}`
    TO "serviceAccount:…" (double quotes kept to mirror the docs); same order in secrets.sh, scheduled_query.sh, deploy_job.sh.'
  verified: fixed in cloud_function_new_deals/deploy.sh tables() + bigquery_schema.sql (DRYRUN=1 renders; GRANT not yet executed)
- id: R02
  symptom: 'User risk table / G02: Cloud Scheduler job gets 403 PERMISSION_DENIED invoking the private function'
  layer: L14
  surfaces: A
  cause: The SA carried bigquery.jobUser and dataEditor but not roles/run.invoker on the service (--no-allow-unauthenticated).
  fix: 'deploy.sh invoker: gcloud run services add-iam-policy-binding $FN --member serviceAccount:$SA --role roles/run.invoker before the jobs
    are created; audience = service URL without query string.'
  verified: fixed in cloud_function_new_deals/deploy.sh invoker() (DRYRUN=1 prints the binding; 403 test not yet — first authenticated run)
- id: R03
  symptom: 'User risk table / G03 / G04: two runs overlap (same-minute second entity, or a Scheduler retry after a slow attempt) — shared staging
    truncated, watermark advanced over lost rows, or the second entity 429s out'
  layer: L15
  surfaces: A (B2 C need their own guard)
  cause: 'main.py used one shared new_deals_staging with WRITE_TRUNCATE and both jobs had cron "0 7 * * 1"; --max-instances 1 --concurrency 1
    alone does not serialise a retry after a 504 and turns the second job into 429s (G04 contested: the retry race needs a > 540 s run, unrealistic
    at ~6 deals/week; the 429 starvation is real).'
  fix: 'Per-run staging new_deals_staging_<entity>_<run_ts> (merge_rows), report_state.lock_until lease via one atomic UPDATE (acquire_lease →
    409), offset schedules SCHEDULE_ICALPS="20 7 * * 1"; the instance cap stays as defence in depth. B2: N8N_CONCURRENCY_PRODUCTION_LIMIT=1 +
    maxScale 1 + respond-when-finished; C: transaction + value-idempotent PATCH.'
  verified: fixed in main.py (tests/test_main_offline.py::test_live_uses_per_run_staging_and_frozen_update_list, ::test_overlapping_run_gets_409_and_writes_nothing);
    deploy/n8n/service.yaml; sql/new_deals_weekly.sql
- id: R04
  symptom: 'User risk table / G11 / C-G8: a rotated HubSpot token is not used by running instances (--set-secrets …:latest)'
  layer: L2
  surfaces: A C
  cause: 'Env-var secrets resolve at instance start; Google recommends pinning a version. Contested for A: at weekly scale-to-zero every run is
    a cold start, so :latest would be re-read anyway — pinning is reviewability, not correctness.'
  fix: deploy.sh deploy pins hubspot-token:<SECRET_VERSION or newest enabled number>; writeback/deploy_job.sh refuses to deploy without HUBSPOT_WRITE_TOKEN_VERSION;
    rotation = secret + deploy / gcloud run jobs update --update-secrets.
  verified: fixed in deploy.sh secret_version() and writeback/deploy_job.sh (contested materiality per result_A G11)
- id: R05
  symptom: 'User risk table / G10: deploy.sh used gcloud functions deploy --gen2 (compatibility path) while the documented command is gcloud run
    deploy --function; URL source serviceConfig.uri breaks after migration'
  layer: L0
  surfaces: A
  cause: 'Two supported deploy surfaces for the same function; mixing them changes the URL and the Scheduler audience (contested: either alone
    works).'
  fix: deploy.sh deploy uses gcloud run deploy $FN --source . --function new_deals_report --base-image python312 … ; url() reads gcloud run services
    describe --format value(status.url); Scheduler jobs are create-or-update with that URL.
  verified: fixed in cloud_function_new_deals/deploy.sh (commit b5c37ab; DRYRUN=1 prints the canonical command)
- id: R06
  symptom: 'G01: deploy.sh piped bigquery_schema.sql with a literal your_project — step "tables" could never succeed'
  layer: L0
  surfaces: A (C reuses the same file)
  cause: Hard-coded project id in the SQL and in deploy.sh; no step created the dataset.
  fix: bigquery_schema.sql uses ${PROJECT}.${DATASET} / ${BQ_LOCATION}; deploy.sh tables renders with envsubst (sed fallback) and dies on an unrendered
    placeholder; check-env refuses placeholder values from .env.example.
  verified: 'fixed in cloud_function_new_deals/bigquery_schema.sql + deploy.sh tables()/check_env() (DRYRUN=1: "rendered, 35 lines"; sql/apply.sh
    DRYRUN=1 renders it too)'
- id: R07
  symptom: 'G05: ?dry_run=1 skipped every BigQuery read, so the gate rehearsed a different window (now − 7 d) with no warehouse de-dup'
  layer: L11
  surfaces: A
  cause: client = None if dry; known = {} without a client; fallback window.
  fix: 'main.py always builds the client; dry guards only merge_rows, write_history, write_watermark, write_run and _deliver; payload carries
    dry_run: true; deploy.sh dry asserts it.'
  verified: fixed in main.py (tests/test_main_offline.py::test_dry_reads_but_writes_nothing)
- id: R08
  symptom: 'G06: day1_hot_score / day1_hot_flag overwritten on re-observation or replay ("day-1" became "latest")'
  layer: L7
  surfaces: A B C
  cause: MERGE UPDATE list excluded only deal_id and first_seen_run.
  fix: FROZEN = (deal_id, first_seen_run, day1_hot_score, day1_hot_flag) in main.py; the same set in build_workflow.py sql_templates() and in
    sql/new_deals_weekly.sql's UPDATE list.
  verified: fixed in main.py, workflows/src/build_workflow.py, sql/new_deals_weekly.sql (tests/test_main_offline.py and tests/test_n8n_code.py
    assert the frozen columns are absent from UPDATE SET)
- id: R09
  symptom: 'G08: README promised a HubSpot workflow webhook (event mode) but the service is private — HubSpot cannot mint Google OIDC tokens;
    a wrong entity dropped the deal with HTTP 200'
  layer: L3
  surfaces: A
  cause: --no-allow-unauthenticated plus a HubSpot-side auth model (signature / API key) that Cloud Run does not accept.
  fix: Keep the code path (tests prove it never touches the watermark) but document event mode as "not deployed in A"; a relay would live in n8n
    (B) or behind a signature-validating public ingress.
  verified: 'contested: code kept, deployment decision open (result_A open question, default "not deployed in A"); tests/test_main_offline.py::test_event_mode_never_touches_watermark'
- id: R10
  symptom: 'G09: deploy.sh was neither idempotent nor fail-loud (|| true on SA and jobs, no services enable, no run.builder, new secret version
    on every run)'
  layer: L0
  surfaces: A
  cause: One-shot script written for a first deploy.
  fix: 'deploy.sh rewritten as a step runner: describe-then-create/update for SA, secret, service IAM and jobs; enable-apis; roles/run.builder
    for the compute SA; secret create || versions add only in the explicit secret step; set -euo pipefail.'
  verified: fixed in cloud_function_new_deals/deploy.sh (commit b5c37ab; bash -n and DRYRUN=1 pass)
- id: R11
  symptom: 'G13: no per-run audit record — a failed or empty week left no row to query'
  layer: L13
  surfaces: A B C
  cause: Only report_state.updated_at and row-level last_seen_run existed.
  fix: hubspot.new_deals_runs (bigquery_schema.sql) written by main.py write_run() on success and failure, by the B2 "Run log" node and by sql/new_deals_weekly.sql
    (incl. ABORTED on a stale sync); hubspot.new_deals_history (sql/audit_tables.sql) per run.
  verified: fixed in bigquery_schema.sql, main.py, build_workflow.py, sql/new_deals_weekly.sql, sql/audit_tables.sql (offline tests assert the
    rows; live rows not yet)
- id: R12
  symptom: 'G14: plain-text logging without severity or entity/run_ts fields'
  layer: L16
  surfaces: A
  cause: logging.basicConfig.
  fix: 'main.py _JsonFormatter: one JSON object per line with severity, message and the extra fields (entity, run_ts, rows, written, window, duration_ms).'
  verified: fixed in main.py (test output shows the JSON lines)
- id: R13
  symptom: 'G17: Scheduler jobs were created enabled before any dry run'
  layer: L11
  surfaces: A B
  cause: deploy.sh created the jobs and only echoed the dry-run command afterwards.
  fix: deploy.sh invoker creates then pauses; deploy.sh enable resumes after deploy.sh dry; deploy/n8n/scheduler.sh does the same (create → pause;
    enable).
  verified: fixed in deploy.sh invoker()/enable() and deploy/n8n/scheduler.sh (DRYRUN=1 shows the pause commands)
- id: R14
  symptom: 'G07: recent_names kept one deal_id per name_key and passed an unused @e parameter; errors were hidden at WARNING'
  layer: L6
  surfaces: A
  cause: 'Dict {name_key: deal_id} made dup_known order-dependent when the twin was already in new_deals (reproduced offline); the parameter was
    dead code.'
  fix: recent_names returns key → [deal_ids], shape() excludes the deal itself, the bare except logs at ERROR with the message.
  verified: 'contested: BigQuery''s treatment of unused parameters unproven, but the fix is the same either way — fixed in main.py (tests/test_main_offline.py
    dup twin "999" asserted)'
- id: R15
  symptom: 'B-G01: an n8n Schedule Trigger never fires while the Cloud Run instance is scaled to zero'
  layer: L3
  surfaces: B
  cause: No instance polls the scheduler queue while asleep; the durable scheduler only survives restarts of a running instance.
  fix: B2 is triggered by Cloud Scheduler → Webhook (deploy/n8n/scheduler.sh, same cron and time zone as A) with minScale 0; the Schedule-Trigger
    variant (minScale 1, ≈ +$53/month) is documented, not scaffolded.
  verified: fixed in deploy/n8n/scheduler.sh + workflows/NEW_DEALS_FULL.json (Webhook node first)
- id: R16
  symptom: 'B-G02: SQLite on Cloud Run loses workflows, credentials and the encryption key at scale-to-zero or redeploy'
  layer: L0
  surfaces: B
  cause: Ephemeral filesystem.
  fix: deploy/n8n/cloudsql.sh (Postgres 17 db-f1-micro) + service.yaml DB_TYPE=postgresdb via /cloudsql/…:n8n-db; N8N_ENCRYPTION_KEY pinned from
    Secret Manager (secrets.sh, create-only).
  verified: fixed in deploy/n8n/cloudsql.sh, service.yaml, secrets.sh (DRYRUN=1 renders; instance not yet created)
- id: R17
  symptom: 'B-G03: the B1 delivery webhook was unauthenticated — anyone could e-mail a forged report'
  layer: L14
  surfaces: A B
  cause: Webhook node without authentication on a public n8n service; main.py posted without a header.
  fix: Header Auth credential (X-Delivery-Token) on every webhook in build_workflow.py; main.py sends DELIVERY_WEBHOOK_TOKEN (Secret Manager via
    DELIVERY_WEBHOOK_TOKEN_SECRET); scheduler.sh sends the same header from n8n-webhook-token.
  verified: fixed in workflows/NEW_DEALS_DELIVERY.json, NEW_DEALS_FULL.json, main.py _deliver(), deploy.sh deploy(), deploy/n8n/scheduler.sh
- id: R18
  symptom: 'B-G04: B1 could silently lose a week''s e-mail — watermark advanced, then one fire-and-forget POST to a cold n8n'
  layer: L9
  surfaces: A B
  cause: main.py logged exceptions only; a 30 s timeout against a cold start; no later window re-sends.
  fix: 'main.py _deliver(): 3 attempts (0/5/15 s), raise_for_status, 60 s timeout; status OK_DELIVERY_FAILED + delivery_error recorded in new_deals_runs;
    next iteration: deliver from new_deals_last_7d.'
  verified: fixed in main.py (retry loop read); re-send-from-view open (result_B open question, default yes)
- id: R19
  symptom: 'B-G05: B1 sent nothing on a zero-row week'
  layer: L9
  surfaces: B
  cause: Split Out on an empty rows array yields no items.
  fix: IF "Any rows?" on body.row_count > 0 with a text-only "Email (no rows)" branch in NEW_DEALS_DELIVERY.json.
  verified: fixed in workflows/src/build_workflow.py build_delivery() (generated file --check up to date)
- id: R20
  symptom: 'B-G06: B2 re-opened the watermark race — n8n runs production executions concurrently; a Scheduler retry after a 504 starts a second
    execution of the same window'
  layer: L15
  surfaces: B
  cause: N8N_CONCURRENCY_PRODUCTION_LIMIT default −1; Cloud Run default timeout 300 s; Scheduler default deadline 180 s.
  fix: 'service.yaml: N8N_CONCURRENCY_PRODUCTION_LIMIT=1, maxScale 1, timeoutSeconds 900; scheduler.sh --attempt-deadline 900s; Webhook responseMode
    responseNode (responds when done).'
  verified: fixed in deploy/n8n/service.yaml, scheduler.sh, build_workflow.py (no lease row in B2 — open, see L15)
- id: R21
  symptom: 'B-G07: respond-immediately webhook + request-based billing throttled the CPU after the response, executions crawled'
  layer: L15
  surfaces: B
  cause: responseMode onReceived under cpu-throttling.
  fix: 'service.yaml run.googleapis.com/cpu-throttling: "false" (instance-based billing); B1 webhook responds lastNode; B2 responds via Respond
    node after the last write.'
  verified: fixed in deploy/n8n/service.yaml and build_workflow.py
- id: R22
  symptom: 'B-G08: the BigQuery node''s named parameters are STRING-only — TIMESTAMP/BOOL/ARRAY parameters cannot be passed'
  layer: L7
  surfaces: B
  cause: Node implementation sends parameterType STRING.
  fix: 'B2 SQL is literal text generated per run: rows as one JSON string literal read with UNNEST(JSON_QUERY_ARRAY(PARSE_JSON(''''''…'''''')))
    and SAFE_CAST per column; timestamps as TIMESTAMP ''…'' literals.'
