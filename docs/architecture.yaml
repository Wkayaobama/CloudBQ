# Architecture annotations for the tree /f visualizer (.claude/skills/tree-f-visualizer). One entry per building block:
# scenarios it belongs to, execution layer (pass-sequence L0–L17), role, status, parity word (same as docs/execution_surfaces.yaml),
# and the aider recipe that produces it. Regenerate with:
#   python3 .claude/skills/tree-f-visualizer/scripts/tree_f.py --root . --annotations docs/architecture.yaml \
#     --out-json docs/architecture.manifest.json --out-ascii docs/ARCHITECTURE_TREE.txt --out-html docs/architecture_tree.html
project: CloudBQ
exclude: ['*.patch']            # the diff ledger's patches are listed in docs/diffs/INDEX.md, not in the tree
scenarios:
  A: Cloud Run function (gcloud run deploy --function, Scheduler OIDC, Secret Manager → BigQuery MERGE)
  B: n8n on Cloud Run (B1 delivery tail · B2 owns the workflow JSON)
  C: Hybrid (BigQuery computes · Node 22 job writes back · Breeze consumes · Claude iterates)
layers:
  L0: Code acquisition & deploy unit
  L1: Identity to BigQuery (ADC/SA)
  L2: Secrets (HubSpot token)
  L3: Trigger & schedule
  L4: Extraction window
  L5: Scoring arithmetic (hot score v1)
  L6: Shaping & duplicate flag
  L7: Load → MERGE into hubspot.new_deals
  L8: Watermark advance
  L9: Delivery (XLSX/email)
  L10: Write-back to HubSpot
  L11: Dry-run gate
  L12: Replay / backfill
  L13: Audit trail (history per run)
  L14: Access control
  L15: Concurrency & retry safety
  L16: Observability
  L17: Cost & scale-to-zero
nodes:
  CONVENTIONS.md: {scenarios: [A, B, C], layer: L0, status: new, parity: Divergent, role: 'Rules every scaffolded block follows (idempotent by construction, gate before live, shared truth in BigQuery, no secrets in git); read by aider on every run', recipe: .claude/skills/aider-scaffold/assets/recipes/tooling_reusable_skills.md}
  .env.example: {scenarios: [A, B, C], layer: L2, status: new, parity: Divergent, role: 'One settings contract for every lane (PROJECT, REGION, DATASET, FN, SA_NAME, schedules, SYNC_*, N8N_*); scripts refuse placeholders', notes: .env itself is gitignored, recipe: .claude/skills/aider-scaffold/assets/recipes/a_deploy_canonical.md}
  .aider.conf.yml: {scenarios: [A, B, C], layer: L0, status: new, role: 'aider: auto-commits, attribution, show-diffs, reads CONVENTIONS.md', parity: Divergent, recipe: .claude/skills/aider-scaffold/assets/recipes/tooling_reusable_skills.md}
  .aiderignore: {scenarios: [A, B, C], layer: L0, status: new, role: 'files aider must never add (secrets, ledger, workbook)', parity: Divergent, recipe: .claude/skills/aider-scaffold/assets/recipes/tooling_reusable_skills.md}
  .claude/agents/discovery-agent.md: {scenarios: [A, B, C], layer: L0, status: new, role: 'Reusable agent: memory recovery → analyst per scenario → adversarial skeptic → pass-sequence synthesis', parity: Divergent, recipe: .claude/skills/aider-scaffold/assets/recipes/tooling_reusable_skills.md}
