title: CloudBQ new-deals — three scenarios, one pipeline
verdict: 'Verdict (pre-flight, 2026-10-05, commit 9e7e18a and the critic fixes that followed — no scenario has yet run against GCP): the three
  scenarios are built to converge on

  the same BigQuery state. A (Cloud Run function, cloud_function_new_deals/), B2 (n8n on Cloud Run, workflows/NEW_DEALS_FULL.json) and

  C (BigQuery scheduled script sql/new_deals_weekly.sql + Node write-back job writeback/) all MERGE into hubspot.new_deals on deal_id

  with the same frozen columns (deal_id, first_seen_run, day1_hot_score, day1_hot_flag), advance a row of hubspot.report_state only after

  that MERGE, score with one set of constants (scoring/hot_score_v1.constants.json) pinned by shared vectors, and write the same audit

  tables (new_deals_runs, new_deals_history, writeback_log). That is the parallel lane: L5, L7, L8, L13. L3, L6, L11, L12 are

  Conditional (same clock, same twin horizon, a dev dataset for the SQL rehearsal, a covered replay window); the other ten layers are

  Divergent by mechanism (deploy unit, identity, secrets, extraction source, delivery, write-back, access, concurrency, observability,

  cost) and each names the file that makes them equivalent. Pass 0 (scaffold): commits 15c926b scoring, b5c37ab + c6a7cc9 scenario A,

  913f63a scenario C, 9e7e18a scenario B; offline evidence tests/test_hot_score.py (15 vectors, JS == Python), tests/test_main_offline.py

  (6 tests), tests/test_n8n_code.py (Code node == main.shape()), DRYRUN=1 rehearsals of deploy.sh, sql/apply.sh, deploy/n8n/*.sh,

  writeback/deploy_job.sh. The probe for pass 1 is `deploy.sh probe` / `deploy.sh status` (bq over new_deals, new_deals_runs,

  report_state) — paste its dated output here after the first live run. Recommendation: A as the production orchestrator with B1

  (workflows/NEW_DEALS_DELIVERY.json) as its delivery tail and C''s compute views + write-back job as the Breeze-facing extension; B2 only if

  the n8n editor must be the operating surface.'
legend: 'Legend: Parity column colours — green Parallel, yellow Conditional, orange Divergent. The columns A/B/C are the three candidate

  SCENARIOS (not three terminals), so the Overview''s "Ubuntu" column reads as *runtime*. Layers L0–L17 are the execution layer from code

  acquisition to cost; Pipeline steps are scenario A''s deploy.sh sub-commands in deploy order (check-env … invoker → dry gate → run →

  enable → probe/status → replay) with the equivalent B and C step or "n/a"; LIVE gates mark the rows that write to GCP or HubSpot.

  Remediation R01–R46 = the user''s risk table (R01–R05) plus every CONFIRMED gap of the verified discovery (result_A/B/C.json) and the

  contested gaps that were implemented anyway; "verified" says fixed in <path>, contested: <why>, or open. Equality checks lists what

  to compare between two scenarios after each stage. Source: the CloudBQ repository on branch claude/cloud-run-bigquery-pipeline-e94ziy

  at 2026-10-05 (9e7e18a): cloud_function_new_deals/{main.py, deploy.sh, bigquery_schema.sql}, scoring/, sql/, writeback/, deploy/n8n/,

  workflows/, tests/; scratchpad/discovery/scenario_{A,B,C}.md and result_{A,B,C}.json; the user''s scenario notes and risk table of

  2026-10-05. Nothing has run against GCP: every "not yet" is the first authenticated run''s job. Parity here is OUTCOME parity: Parallel means
  the same tables, keys, constants and audit rows whichever lane runs, proven by tests/ (Python == JS) and by the equality checks once credentials
  exist; L5/L7/L8/L13 are three code paths that must agree, not one shared code path.'
surfaces:
  A: 'A · Cloud Run function (deploy.sh → gcloud run deploy --function, Scheduler OIDC, Secret Manager, BigQuery MERGE) — operator surfaces: Cloud Shell runbook docs/RUNBOOK_CLOUD_SHELL.md and the Vertex AI Workbench notebook notebooks/cloudbq_deploy_and_witness.ipynb (same deploy.sh)'
  B: B · n8n on Cloud Run (B1 delivery tail NEW_DEALS_DELIVERY.json; B2 full pipeline NEW_DEALS_FULL.json via Scheduler → webhook)
  C: C · BigQuery compute (synced deals, hot_score_v1 UDF, scheduled script) + Node 22 write-back job; Breeze reads, Claude iterates
motions:
- motion: A · Cloud Run function + Cloud Scheduler
  acquire: 'git clone the branch; cloud_function_new_deals/deploy.sh is the execution surface (sub-commands check-env enable-apis iam tables secret

    deploy invoker | dry | run | enable | probe | status | replay; DRYRUN=1 prints every gcloud/bq command). Deploy unit = the directory,

    built by `gcloud run deploy $FN --source cloud_function_new_deals --function new_deals_report --base-image python312`.'
  ubuntu: 'Cloud Run service (python312 base image, functions-framework), region $REGION (europe-west6), --no-allow-unauthenticated,

    --service-account new-deals-fn@, --timeout 540 --memory 512Mi --max-instances 1 --concurrency 1, scale to zero.'
  driver: 'Cloud Scheduler HTTP jobs new-deals-SEALSQ (0 7 * * 1) and new-deals-ICALPS (20 7 * * 1) Europe/Zurich, OIDC as the SA with

    audience = service URL, --attempt-deadline 600s, 3 retries, created PAUSED and resumed by `deploy.sh enable` after `deploy.sh dry`;

    manual: curl with `gcloud auth print-identity-token`; ?dry_run=1 reads everything, writes nothing.'
  state: 'hubspot.report_state (watermark + lock_until lease per NEW_DEALS_<entity>), hubspot.new_deals (MERGE on deal_id), per-run staging

    new_deals_staging_<entity>_<run_ts> (dropped), hubspot.new_deals_runs + new_deals_history (audit), Secret Manager hubspot-token:<pinned>,

    .env (gitignored) for PROJECT/REGION/DATASET.'
  assessment: 'Fully programmed; offline tests prove dry-reads/no-writes, per-run staging, frozen update list, watermark after MERGE, 409 on an

    overlapping lease, event mode never touching the watermark. First-deploy expectation medium: one or two IAM / API iterations, and

    new_deals_history must exist before the first live run (R44). Cheapest (< $1/month) and the only keyless lane.'
- motion: B · n8n on Cloud Run (B1 delivery tail; B2 full pipeline)
  acquire: 'deploy/n8n/{secrets.sh, cloudsql.sh, deploy_n8n.sh, import_workflows.sh, scheduler.sh}; service.yaml applied with

    `gcloud run services replace` (pinned image docker.io/n8nio/n8n:2.41.7); workflows/*.json generated by workflows/src/build_workflow.py

    (stable ids → re-import updates in place) and imported through the public REST API with X-N8N-API-KEY.'
  ubuntu: 'n8n container on Cloud Run: minScale 0 / maxScale 1, cpu-throttling false, timeoutSeconds 900, Cloud SQL Postgres n8n-db (db-f1-micro)

    via /cloudsql, N8N_ENCRYPTION_KEY + DB password from Secret Manager, N8N_CONCURRENCY_PRODUCTION_LIMIT=1, N8N_ENDPOINT_HEALTH=health,

    EXECUTIONS_DATA_MAX_AGE=2160.'
  driver: 'B1: the function POSTs its payload to /webhook/new-deals (Header Auth X-Delivery-Token). B2: Cloud Scheduler jobs n8n-new-deals-SEALSQ
    /

    -ICALPS (same cron and time zone as A) POST /webhook/new-deals-run?entity=…, attempt-deadline 900s, 3 retries, created PAUSED;

    ?dry_run=1 on the webhook responds without writing; manual execution in the editor is the n8n-native rehearsal.'
  state: 'Same hubspot.* tables as A (B2 MERGE/history/watermark/run-log SQL is generated from bigquery_schema.sql); n8n credentials and

    executions in Cloud SQL (SA key n8n-bq, HubSpot token copy, SMTP, Header Auth); secrets n8n-encryption-key, n8n-db-password,

    n8n-webhook-token in Secret Manager.'
  assessment: 'B1 is the natural delivery tail for A and C (XLSX + email, zero-row branch, Header Auth). B2 reaches the same table/watermark state

    (Code node == main.shape() offline) but re-implements the window, scorer, MERGE and watermark in JSON, needs an exported SA key and a

    token copy inside n8n, has no lease row, and costs ≈ $9–11/month for the Cloud SQL floor even at scale-to-zero.'
- motion: C · BigQuery compute + Node write-back + Breeze + Claude
  acquire: 'sql/sync_transfer.sh (DTS HubSpot connector → $SYNC_DATASET), sql/apply.sh (bigquery_schema.sql → audit_tables.sql → hot_score_v1.sql
    →

    deals_synced_v1.sql → hot_deals_v1.sql, rendered from .env), sql/refresh_pipeline_labels.sh, sql/scheduled_query.sh (one scheduled

    query per entity running sql/new_deals_weekly.sql), writeback/deploy_job.sh (`gcloud run jobs deploy --source writeback`).'
  ubuntu: 'BigQuery itself (persistent SQL UDF hubspot.hot_score_v1, versioned views hot_deals_v1 / _top5_by_region / _writeback, multi-statement

    script in one transaction, SA new-deals-sql) plus a Node 22 Cloud Run job new-deals-writeback (SA new-deals-writeback, 1 task,

    --max-retries 2, --task-timeout 900s); Breeze reads materialised properties; Claude iterates with bq --dry_run and a hubspot_dev dataset.'
  driver: 'Chain of clocks: DTS transfer every day 02:00 UTC → scheduled queries new-deals-<entity>-C "every monday 03:53" / "04:23" (per entity, off the hour, UTC only) →

    Cloud Scheduler new-deals-writeback 30 5 * * 1 Europe/Zurich POSTing jobs.run with --oauth-service-account-email new-deals-scheduler@.

    Gates: DISABLE_SCHEDULE=1 registers without auto-scheduling (manual `bq mk --transfer_run`); WRITEBACK_APPROVE unset → DRY rows only.'
  state: 'Same hubspot.new_deals / new_deals_runs / new_deals_history; its own report_state key NEW_DEALS_<entity>_C; hubspot.writeback_log;

    hubspot.pipeline_labels; the synced tables in $SYNC_DATASET; Secret Manager hubspot-token-write:<pinned>; HubSpot deal properties

    hot_score_v1 / hot_flag_v1 (writeback/bootstrap_property.sh, one-off).'
  assessment: 'Strongest compute (window functions, per-region top-5, one transaction for MERGE + audit + state) and the only implemented

    write-back (batch PATCH ×100, 207 handling, value-idempotent, never NULL). Extraction is a scheduled full-refresh sync, so the window

    is a 14-day lookback with a 36 h freshness guard — one-cycle lag, no event mode. Blocked until a write-scoped private app exists

    (R35) and the synced table names are known after the first transfer run (R36). Free tiers throughout.'
layers:
- id: L0
  layer: Code acquisition & deploy unit
  A: 'cloud_function_new_deals/ as one source-deploy unit: `deploy.sh deploy` → gcloud run deploy $FN --source . --function new_deals_report

    --base-image python312 (canonical form; URL from `gcloud run services describe --format value(status.url)`). Every step create-or-update;

    DRYRUN=1 rehearses the whole sequence offline.'
  B: 'deploy/n8n/service.yaml rendered by deploy_n8n.sh and applied with `gcloud run services replace` (declarative); image pinned

    docker.io/n8nio/n8n:2.41.7 (:latest refused); workflows/NEW_DEALS_{FULL,DELIVERY,ERRORS}.json generated by workflows/src/build_workflow.py

    (--check gate, pinned node typeVersions) and imported by deploy/n8n/import_workflows.sh (PUT by stable id).'
  C: 'Three units: SQL objects via sql/apply.sh (bq query, OR REPLACE / IF NOT EXISTS), scheduled queries via sql/scheduled_query.sh

    (bq mk/update --transfer_config), the job via writeback/deploy_job.sh (gcloud run jobs deploy --source writeback, Dockerfile node:22-slim);

    the sync via sql/sync_transfer.sh (bq mk --transfer_config --data_source=hubspot).'
  parity: Divergent
  diverges: 'Three deploy units, three versioning stories: a Python directory built by Cloud Build, a container image + workflow JSON stored in

    Cloud SQL, SQL text stored inside transfer configs plus a Node job. Only A and C are fully reproducible from git; B''s running state also

    includes credentials created in the UI.'
  remediation: 'Every unit is a create-or-update script reading the same .env (.env.example) and honouring DRYRUN=1; workflows are generated,
    never

    hand-edited (build_workflow.py --check in tests/test_n8n_code.py); docs/diffs ledger keeps one patch per commit.'
  verified: 'DRYRUN=1 deploy.sh (all sub-commands print their commands); DRYRUN=1 deploy/n8n/deploy_n8n.sh (renders service.yaml, no placeholder);

    DRYRUN=1 sql/apply.sh (5 files render, 17 DDL statements); DRYRUN=1 writeback/deploy_job.sh; build_workflow --check up to date.

    Real deploy: not yet — first authenticated run.'
- id: L1
  layer: Identity to BigQuery (ADC/SA)
  A: 'Keyless: SA new-deals-fn@$PROJECT is the revision identity, ADC inside the container. `deploy.sh iam` grants roles/bigquery.jobUser

    (project) and roles/run.builder to the compute SA; `deploy.sh tables` issues GRANT `roles/bigquery.dataEditor` ON SCHEMA

    `$PROJECT.$DATASET` TO "serviceAccount:new-deals-fn@…" after CREATE SCHEMA IF NOT EXISTS.'
  B: 'B1: n8n never touches BigQuery. B2: Google Service Account credential = exported JSON key of n8n-bq@ written by deploy/n8n/secrets.sh

    to deploy/n8n/.secrets/n8n-bq.key.json (gitignored), same jobUser + DCL GRANT; stored encrypted in Cloud SQL under N8N_ENCRYPTION_KEY.

    n8n has no ADC / Workload Identity path. Runtime SA n8n-run@ holds only cloudsql.client + secretAccessor.'
  C: 'Two keyless SAs: new-deals-sql@ runs the scheduled queries (--service_account_name, sql/scheduled_query.sh grants jobUser + the same

    DCL GRANT) and new-deals-writeback@ is the job''s ADC (writeback/deploy_job.sh grants the same pair). The DTS connector writes

    $SYNC_DATASET under a Google-managed identity. Claude''s user ADC: dataViewer on hubspot, dataEditor on hubspot_dev (proposed).'
  parity: Divergent
  diverges: 'A and C are keyless (ADC); B2 needs a long-lived SA key inside n8n''s database (B-G10) — a different mechanism and a different

    rotation story (secrets.sh re-creates the key, the credential is re-imported by id).'
  remediation: 'The same two grants for every identity, issued by deploy.sh tables, deploy/n8n/secrets.sh, sql/scheduled_query.sh and

    writeback/deploy_job.sh (one GRANT statement each, double-quoted principal). If org policy blocks key creation, drop the BigQuery

    node for an HTTP Request to the metadata token endpoint (result_B open question).'
  verified: 'GRANT text identical in the four scripts (read); DRYRUN=1 prints the bindings. IAM applied: not yet — first authenticated run.'
- id: L2
  layer: Secrets (HubSpot token)
  A: '`deploy.sh secret`: Secret Manager hubspot-token (create or versions add from $HUBSPOT_TOKEN typed into the shell — never in .env, check-env refuses it), accessor for the SA; prints the version NUMBER; `deploy.sh deploy` pins --set-secrets HUBSPOT_TOKEN=hubspot-token:${SECRET_VERSION} (empty → newest enabled version number resolved with value(name.basename()) at deploy time, never the literal "latest" and never the resource path, R47); optional DELIVERY_WEBHOOK_TOKEN from $DELIVERY_WEBHOOK_TOKEN_SECRET.'
  B: 'deploy/n8n/secrets.sh creates n8n-encryption-key, n8n-db-password, n8n-webhook-token (create-only, never echoed) and binds n8n-run@;

    service.yaml mounts the first two as env; the HubSpot token is copied by hand from Secret Manager into an n8n "HubSpot App Token"

    credential (External Secrets is Enterprise-only), id mapped in workflows/credentials.map.json.'
  C: 'Write token in Secret Manager hubspot-token-write, pinned: writeback/deploy_job.sh refuses to deploy without HUBSPOT_WRITE_TOKEN_VERSION

    (--set-secrets HUBSPOT_TOKEN=hubspot-token-write:<n>); the DTS transfer config keeps its own read-token copy

    (connector.authentication.oauth.accessToken); the schema-write token is used once by writeback/bootstrap_property.sh and not stored.'
  parity: Divergent
  diverges: 'A and C hold one pinned Secret Manager version each; B keeps copies inside n8n (Cloud SQL) and the transfer config keeps a third
    copy.

    Rotation: A redeploy / C `gcloud run jobs update --update-secrets`; B re-create the credential; DTS `bq update --transfer_config --params`.'
  remediation: 'Pin versions everywhere (deploy.sh secret_version(), deploy_job.sh); two private apps (read-only for A/B/DTS, crm.objects.deals.write

    only for the job, R35); document the three rotation commands in one runbook row.'
  verified: 'deploy.sh secret_version() resolves the version NUMBER with value(name.basename()) — value(name) returned projects/…/versions/N and would have been rejected by --set-secrets (R47, fixed 574e954, DRYRUN=1 prints the corrected command); deploy_job.sh refuses a missing version (DRYRUN=1 run); secrets.sh DRYRUN=1 lists the three secrets. Secrets created: not yet — first authenticated run.'
- id: L3
  layer: Trigger & schedule
  A: '`deploy.sh invoker`: two Cloud Scheduler HTTP jobs new-deals-SEALSQ "0 7 * * 1" and new-deals-ICALPS "20 7 * * 1" --time-zone Europe/Zurich, GET $URL?entity=…, --oidc-service-account-email new-deals-fn@, --oidc-token-audience $URL, --attempt-deadline 600s, --max-retry-attempts 3, create-or-update, created PAUSED; `deploy.sh enable` resumes only PAUSED jobs and `pause` only ENABLED ones (idempotent, R49). Cloud Scheduler is offered in europe-west6 (locations page, 2026-10-16).'
  B: 'B1: A''s jobs; the function then POSTs to the webhook. B2: deploy/n8n/scheduler.sh — jobs n8n-new-deals-SEALSQ / -ICALPS with the same

    SCHEDULE_SEALSQ / SCHEDULE_ICALPS and time zone from .env, POST $N8N_URL/webhook/new-deals-run?entity=…, header X-Delivery-Token from

    secret n8n-webhook-token, --attempt-deadline 900s, 3 retries, created PAUSED; `scheduler.sh enable` resumes. (In-app Schedule Trigger

    is not used: it never fires at minScale 0, B-G01.)'
  C: 'sql/sync_transfer.sh: DTS "every day 02:00" (UTC) → sql/scheduled_query.sh: "every monday 03:53" (SEALSQ) / "04:23" (ICALPS) — per entity and off the hour (two scripts in one minute would be cancelled as conflicting transactions; an on-the-hour schedule can trigger twice), UTC only, DST-insensitive →

    writeback/deploy_job.sh: Cloud Scheduler new-deals-writeback "30 5 * * 1" Europe/Zurich POST jobs.run with --oauth-service-account-email

    new-deals-scheduler@, 3 retries (start failures only). Not paused on create; harmless while WRITEBACK_APPROVE=0.'
  parity: Conditional
  diverges: 'Same result when A and B2 read the same SCHEDULE_* values from .env (they do) and C''s chain keeps its slack (sync 02:00 UTC < query

    03:53 / 04:23 UTC < write-back 05:30 Zurich < A''s 07:00 Zurich). C''s scheduled query drifts one hour across DST relative to the Zurich jobs

    (C-G3); Scheduler retries re-run the same half-open window in A/B2 but only re-issue jobs.run in C (C-G9).'
  remediation: '.env SCHEDULE_SEALSQ / SCHEDULE_ICALPS shared by deploy.sh and scheduler.sh; SCHEDULE_UTC and WRITEBACK_SCHEDULE in

    sql/scheduled_query.sh and writeback/deploy_job.sh chosen with slack; or drive the SQL from the Zurich-scheduled job for one clock.'
  verified: 'DRYRUN=1 deploy.sh invoker and DRYRUN=1 scheduler.sh create print identical cron/time-zone arguments (checked); jobs exist: not yet
    —

    first authenticated run.'
- id: L4
  layer: Extraction window (watermark read, createdate search)
  A: 'main.py read_watermark(): SELECT watermark FROM report_state WHERE report_id = ''NEW_DEALS_<entity>'' (default now − FIRST_RUN_DAYS=7);

    HubSpot POST /crm/v3/objects/deals/search createdate GTE watermark − OVERLAP_MINUTES(5) AND LT run_ts, PROPS (29 properties), sort

    createdate ASC, 200/page; deals filtered by ENTITIES[entity].pipelines, the rest kept as duplicate candidates ("others"). Pass 3

    phase 1: the whole search result (in_scope per deal) and the pipeline/stage/owner maps land in deals_raw / labels_raw keyed by

    (run_ts, entity, orchestrator) before shape() — load first, delete-older second; non-fatal (data_gaps raw_landing_failed); dry does not land.'
  B: 'B1: in the function. B2: node "Read watermark" (same SELECT, same report_id) → Code node "Window" computes watermark_in / query_start /

    query_end once → HTTP Request "HubSpot search" with the identical filterGroups, PROPS list, sort and limit 200, paginated on

    paging.next.after; "Pipelines" and "Owners" HTTP nodes for labels.'
  C: 'No HubSpot search: sql/new_deals_weekly.sql selects deals_synced_v1 WHERE createdate in [run_ts − 14 d, run_ts) AND pipeline_id IN

    ${PIPELINES} after a freshness guard (RAISE + ABORTED run row when MAX(lastmodified) < run_ts − 36 h). Source = scheduled full-refresh

    sync (DTS, Preview) into $SYNC_DATASET.$SYNC_DEALS_TABLE read through the adapter view. No event mode. Pass 3 phase 1: after the guard

    and before the transaction, sql/land_raw.sql (spliced by scheduled_query.sh) lands the 90-day set from the sync TABLE with HubSpot

    property names (TO_JSON of 28 of the 29 PROPS: hs_object_source_detail_1 waits for the first transfer to confirm the column) and the labels,

    same key and same INSERT-then-DELETE-older order as A, inside a BEGIN … EXCEPTION block that names raw_landing_failed; sql/backfill_raw.sh

    lands it once per entity with orchestrator = backfill at cut-over. Phase 2: the landing precedes the CALL of new_deals_batch (the

    script has no transaction of its own any more).'
  parity: Divergent
  diverges: 'A and B2 share the mechanism (watermark row + live createdate search); C reads a scheduled snapshot with a fixed lookback — a deal

    created after the last transfer is missing until the next cycle (C-G2), and C never uses the watermark as its window.'
  remediation: 'lookback_days ≥ 2× the transfer cadence (14 d vs daily), the 36 h RAISE guard, chain slack (L3); accept one-cycle lag or keep
    A''s

    search/event mode as the extractor and let C only compute from new_deals. For strict parity C could read new_deals (A''s output)

    instead of the sync.'
  verified: 'A: tests/test_main_offline.py::test_dry_reads_but_writes_nothing (watermark read in dry mode) and test_first_run_without_watermark_uses_first_run_days;

    B2: tests/test_n8n_code.py (Window values flow into the payload). C: by reading sql/new_deals_weekly.sql; synced columns unknown until

    the first transfer run (R36). Live search: not yet — first authenticated run.'
- id: L5
  layer: Scoring arithmetic (hot score v1)
  A: 'main.py hot_score() — W, BIAS = −6.4788, THRESHOLD = 45.0, CR {12096408: 84/730, 13772279: 51/303}, MAXC = 223; round(s, 1);

    (None, None) for other pipelines. Canonical: tests/test_hot_score.py rebuilds tests/hot_score_vectors.json from it.'
  B: 'workflows/src/shape_score.js hotScore() injected into the Code node "Shape + score" with the constants from

    scoring/hot_score_v1.constants.json at build time (build_workflow.py code_js()); scoring/hot_score_v1.mjs is the standalone JS port

    used by the write-back job and run by the test.'
  C: 'scoring/hot_score_v1.sql → persistent UDF `$PROJECT.$DATASET.hot_score_v1(...) RETURNS STRUCT<score, hot, raw>` applied by sql/apply.sh;

    called by the pass-3 table function new_deals_batch_rows (sql/deals_landed_v1.sql; day1_hot_score / day1_hot_flag, run_ts as "now")

    and sql/hot_deals_v1.sql (hot_score_v1 / hot_flag_v1). tests/hot_score_vectors.sql is the bq check generated from the same vectors;

    tests/pass3_batch_vectors.sql runs the same 15 vectors through the root → view → table function in a dev dataset.'
  parity: Parallel
  diverges: 'Nothing by design: one constants file, one vector file, three ports. The only tolerated difference is a 0.1 step at an exact

    rounding tie (Python half-to-even vs JS/SQL half-away), asserted as |Δscore| ≤ 0.1 with raw |Δ| < 1e-9 (B-G11, contested: unreachable

    in practice).'
  remediation: 'None needed. test_constants_match_json() fails the moment main.py drifts from the constants file; a new fit is v2

    (hot_score_v2 + hot_deals_v2), never an edit of v1.'
  verified: 'tests/test_hot_score.py 2026-10-05: 15 vectors, "constants OK · python vectors OK · JS port OK (raw |Δ| < 1e-9, flags equal)";

    tests/test_n8n_code.py row-for-row equality incl. day1_hot_score; SQL UDF: DuckDB harness offline 0/4,000 mismatches

    (scenario_C.md) — `bq query < tests/hot_score_vectors.sql` (every ok = TRUE): not yet — first authenticated run.'
- id: L6
  layer: Shaping & duplicate flag
  A: 'main.py name_key() (final_customer else first token of dealname split on -/|(, lower-cased alphanumerics, 40 chars) and shape():

    31 columns = bigquery_schema.sql; dup_in_batch across all pipelines in the window; dup_known from recent_names() (new_deals, 90 days,

    every entity, key → [deal_ids], self excluded, ERROR log + empty map on failure); rows sorted (−amount_kusd, deal_id).'
  B: 'workflows/src/shape_score.js nameKey() / shapeRows() — same regexes, same batch + known logic; node "Recent names" runs the same

    90-day SELECT with continue-on-fail (→ empty map like A); same sort. Column list comes from bigquery_schema.sql at build time.'
  C: 'Pass 3 phase 2 — sql/deals_landed_v1.sql: name_key = IFNULL(SUBSTR(REGEXP_REPLACE(LOWER(COALESCE(NULLIF(TRIM(final_customer),''''),

    REGEXP_EXTRACT(dealname, r''^[^-/|(]*''))), r''[^a-z0-9]'', ''''), 1, 40), '''') computed once in the view; new_deals_batch_rows: dups =

    the window against every deal the ROOT knows as of run_ts (any entity, any orchestrator, in-scope or not, 90-day horizon, latest

