equality_checks:
  - stage: after the lab snapshot
    compare: per-deal bin_index — numpy.digitize (N) vs RANGE_BUCKET (Q) on deal_tiers_lab
    N: notebook §5 assert (bq_bin == numpy_bin for every row)
    QW: 'SELECT COUNTIF(bin_index != RANGE_BUCKET(certainty, [0.5, 0.75, 0.9])) FROM deal_tiers_lab → 0'
    expected: zero differences on every deal with a certainty; NULL on both sides without one
  - stage: after the first gold MERGE
    compare: counts per pipeline × tier — deal_tiers_lab (N) vs deal_tiers (Q) vs deal_tiers_summary_v1 (live view)
    N: notebook §6
    QW: 'SELECT pipeline_id, tier, COUNT(*) FROM deal_tiers GROUP BY 1, 2'
    expected: identical (retired rows, tier NULL, excluded on both sides), or differences explained by deals created, edited, deleted or un-tiered between the sync (02:00 UTC) and the snapshot
  - stage: after a second gold MERGE with no CRM change
    compare: deal_tiers_history row count before and after
    N: n/a
    QW: 'SELECT COUNT(*) FROM deal_tiers_history WHERE run_ts = TIMESTAMP ''<the run_time you passed with --parameter>'''
    expected: 0 rows (idempotent MERGE)
  - stage: after the StackSync write-back
    compare: CRM counts per deal_tier_v1 value vs deal_tiers counts per tier
    N: query_crm_data — SELECT deal_tier_v1, COUNT(*) FROM DEAL GROUP BY deal_tier_v1
    QW: 'SELECT tier, COUNT(*) FROM deal_tiers GROUP BY tier'
    expected: identical per label
  - stage: after the company dry run and the ship (pass 2b)
    compare: n_deals per sales_region × entity_key × tier — the dry run over @deals_payload (N, the API snapshot) vs company_tiers_v1 (Q, the sync)
    N: notebook §4 (outer join on the three keys; rows where the counts differ listed)
    QW: 'SELECT sales_region, entity_key, tier, n_deals, resolver FROM company_tiers_v1 ORDER BY 1, 2, 3'
    expected: identical when the snapshot and the sync are of the same state; otherwise differences explained by deals created, edited, deleted or re-associated between the transfer and the snapshot; the resolver per row equal on both sides
parity_meanings:
  Parallel: same arithmetic, same result on every surface (one constants file)
  Conditional: same result when the stated condition holds (the sync exists, the property exists, the same snapshot)
  Divergent: different mechanism (snapshot / daily / event); the gold table and the write-back make the outcome equivalent
